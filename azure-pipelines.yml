# Gradle
# Build your Java project and run tests with Gradle using a Gradle wrapper script.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/java

trigger:
- main

pool:
  name: 'test'
  demands:
   - agent.name -equals mywindowsagent

steps:
- task: Gradle@2
  inputs:
    workingDirectory: ''
    gradleWrapperFile: 'gradlew'
    gradleOptions: '-Xmx3072m'
    javaHomeOption: 'JDKVersion'
    jdkVersionOption: '1.11'
    jdkArchitectureOption: 'x64'

- task: AndroidSigning@3
  inputs:
    apkFiles: '**/*.apk'
    apksign: true
    apksignerKeystoreFile: 'C:\Users\ankit.gangwar\Downloads\pipelines-android-master\android-keystore.jks'
    apksignerKeystorePassword: 'keystore'
    apksignerKeystoreAlias: 'key1'
    apksignerKeyPassword: 'keystore'
    zipalign: true
  displayName: Sign APKs

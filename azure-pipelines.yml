# Gradle
# Build your Java project and run tests with Gradle using a Gradle wrapper script.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/java

trigger:
- main

pool:
  name: 'test'
  demands:
   - agent.name -equals mywindowsagent

variables:
  keystore_password: $(keystorepassword)
  keystore_alias: $(keystorealias)
  key_password: $(keypassword)

steps:

- task: Gradle@2
  inputs:
    workingDirectory: ''
    gradleWrapperFile: 'gradlew'
    gradleOptions: '-Xmx3072m'
    javaHomeOption: 'JDKVersion'
    jdkVersionOption: '1.11'
    jdkArchitectureOption: 'x64'
    publishJUnitResults: true
    testResultsFiles: '**/TEST-*.xml'
    tasks: 'assembleDebug'
  displayName: gradlebuild

- task: AndroidSigning@3
  inputs:
    apkFiles: '**/*.apk'
    apksign: true
    apksignerKeystoreFile: 'android-keystore.jks'
    apksignerKeystorePassword: $(keystore_password)
    apksignerKeystoreAlias: $(keystore_alias)
    apksignerKeyPassword: $(key_password)
    zipalign: true
  displayName: Sign APKs

- task: CopyFiles@2
  inputs:
    Contents: '**/*.apk'
    TargetFolder: '$(build.artifactStagingDirectory)'
- task: PublishBuildArtifacts@1

- task: AppCenterDistribute@3
  inputs:
    serverEndpoint: 'orgappcenter'
    appSlug: 'https://appcenter.ms/users/agangwar/apps/android-release'
    appFile: '$(build.artifactStagingDirectory)'
    releaseNotesOption: 'input'
    releaseNotesInput: 'androidtestapp'

- script: appcenter distribute release --app agangwar/android-release --file $(build.artifactStagingDirectory)/app/debug/*.apk --group "Collaborators"

  

